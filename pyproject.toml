    "pandas>=3.1.1",
    "seaborn>=0.13.2",
]

[project.scripts]
power-app = "power_app:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
