[project]
name = "power-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "edgar.treischl", email = "edgar.treischl@isb.bayern.de" }
]
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
